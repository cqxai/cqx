[package]
name = "cqx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "deka code explorer."

[[bin]]
name = "cqx"
path = "src/main.rs"

[features]
default = []
zega = ["cqx-store/zega"]

[dependencies]
cqx-analysis = { path = "../cqx-analysis" }
deka-cli-core = { workspace = true }
cqx-store = { path = "../cqx-store" }
cqx-score = { path = "../cqx-score" }
cqx-history = { path = "../cqx-history" }
cqx-scan = { path = "../cqx-scan" }
cqx-mcp = { path = "../cqx-mcp" }

[dev-dependencies]
serde_json.workspace = true
