[package]
name = "cqx-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The cqx analysis, callable from a browser."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["core", "c", "csharp"]
core = ["cqx-analysis/core", "dep:cqx-score", "dep:cqx-store"]
c = ["cqx-analysis/c"]
csharp = ["cqx-analysis/csharp"]

[dependencies]
cqx-analysis = { path = "../cqx-analysis", default-features = false }
cqx-rust = { path = "../cqx-rust" }
cqx-score = { path = "../cqx-score", optional = true }
cqx-store = { path = "../cqx-store", optional = true }
cqx-view = { path = "../cqx-view" }
cqx-vfs = { workspace = true }
serde_json = { workspace = true }
