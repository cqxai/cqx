[package]
name = "cqx-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Loads a cqx fact stream into a queryable graph."

[features]
# The graph backend is opt-in because it is a heavy dependency, not because it is
# unavailable: without it cqx still loads and counts facts, it just cannot answer
# a traversal.
default = []
zega = ["dep:zega-core", "dep:zega-parser"]

[dependencies]
cqx-schema = { workspace = true }
deka-cli-core = { workspace = true }
serde_json = { workspace = true }
zega-core = { git = "https://github.com/samifouad/zega", optional = true }
zega-parser = { git = "https://github.com/samifouad/zega", optional = true }
