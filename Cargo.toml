[workspace]
resolver = "2"
members = ["crates/dcx", "crates/dcx-rust", "crates/dcx-schema", "crates/dcx-store"]
exclude = ["samples"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dekaruntime/dcx"

[workspace.dependencies]
dcx-schema = { path = "crates/dcx-schema" }
deka-cli-core = { version = "0.5", default-features = false, features = ["registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
