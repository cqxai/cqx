[workspace]
resolver = "2"
members = ["crates/cqx-layout", "crates/cqx", "crates/cqx-rust", "crates/cqx-ts", "crates/cqx-go", "crates/cqx-kotlin", "crates/cqx-swift", "crates/cqx-zig", "crates/cqx-python", "crates/cqx-php", "crates/cqx-java", "crates/cqx-source", "crates/cqx-analysis", "crates/cqx-scan", "crates/cqx-mcp", "crates/cqx-view", "crates/cqx-schema", "crates/cqx-history", "crates/cqx-score", "crates/cqx-store", "crates/cqx-vfs", "crates/cqx-wasm"]
exclude = ["vendor/rezel-lang-python", "vendor/python-unicode", "vendor/rezel-lang-swift", "vendor/swift-unicode", "vendor/rezel-lang-kotlin", "vendor/kotlin-unicode", "fixtures", "vendor/rezel-lang-java", "vendor/java-unicode"]

[workspace.package]
version = "0.1.24"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cqxai/cqx"

[workspace.dependencies]
cqx-schema = { path = "crates/cqx-schema" }
cqx-vfs = { path = "crates/cqx-vfs" }
toml = "0.8"
deka-cli-core = { version = "0.5", default-features = false, features = ["registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
