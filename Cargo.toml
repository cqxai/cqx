[workspace]
resolver = "2"
members = ["crates/cqx", "crates/cqx-rust", "crates/cqx-scan", "crates/cqx-mcp", "crates/cqx-view", "crates/cqx-schema", "crates/cqx-history", "crates/cqx-score", "crates/cqx-store", "crates/cqx-vfs", "crates/cqx-wasm"]
exclude = ["fixtures"]

[workspace.package]
version = "0.1.23"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cqxai/cqx"

[workspace.dependencies]
cqx-schema = { path = "crates/cqx-schema" }
cqx-vfs = { path = "crates/cqx-vfs" }
toml = "0.8"
deka-cli-core = { version = "0.5", default-features = false, features = ["registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
