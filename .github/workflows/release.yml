name: release

# Cutting a tag builds the tool for every platform it is distributed on,
# proves each binary runs, and publishes them three ways: attached to the
# GitHub release, mirrored into R2 for the installer, and — once the npm
# packages exist — as the platform packages `@cqxai/cli` depends on.
#
# SCCACHE IS REQUIRED FOR ALL RUST COMPILATION.

on:
  push:
    tags: ['v*']
  # A dispatch can only ever build and smoke test. Publishing is reachable
  # from a tag push and from nowhere else, so there is no combination of
  # inputs that reaches the release credentials by hand.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  resolve:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          MANIFEST="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"

          if [ "${{ github.event_name }}" != "push" ]; then
            # A dry run proves the code in front of us builds on four
            # platforms. Building an old tag would prove something about the
            # past — and would check out a tree without this workflow's own
            # actions in it, which is exactly how the first attempt failed.
            {
              echo "ref=${{ github.sha }}"
              echo "tag=v${MANIFEST}"
              echo "version=${MANIFEST}"
            } >> "$GITHUB_OUTPUT"
            echo "dry run against $(git rev-parse --short HEAD), which says ${MANIFEST}"
            exit 0
          fi

          # A tag that disagrees with the manifest is the one mistake that
          # cannot be fixed after the fact: the binaries would report a
          # version nobody can find, and npm would refuse the second publish
          # at that number.
          TAG="${{ github.ref_name }}"
          if [ "$TAG" != "v$MANIFEST" ]; then
            echo "::error::tag $TAG but Cargo.toml says v$MANIFEST"
            exit 1
          fi
          {
            echo "ref=$TAG"
            echo "tag=$TAG"
            echo "version=$MANIFEST"
          } >> "$GITHUB_OUTPUT"
          echo "building $TAG"

  # ---------------------------------------------------------------------------
  build:
    name: cqx (${{ matrix.platform }})
    needs: resolve
    strategy:
      # Every platform reports. One failing runner hiding the other three is
      # how a dry run costs two attempts to learn one thing.
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            bucket: cqx-sccache-linux-x64
          - platform: darwin-x64
            runner: macos-15-intel
            bucket: cqx-sccache-darwin-x64
          - platform: darwin-arm64
            runner: macos-14
            bucket: cqx-sccache-darwin-arm64
          - platform: windows-x64
            runner: windows-latest
            bucket: cqx-sccache-windows-x64
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.event_name == 'push' && 'release' || 'public-ci' }}
    env:
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: ${{ matrix.bucket }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - uses: ./.github/actions/sccache

      # With the graph engine in it. Without `--features zega` every binary
      # anybody downloads refuses `--zql` and `--named` — CI built it only to
      # prove it compiled, and the feature shipped switched off for four
      # releases. It costs about 1.2 MB.
      - name: Build
        shell: bash
        run: cargo build --locked --release -p cqx --features zega

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          # The target directory is `.target` under some local configurations
          # and `target` under others; the release must not care which.
          for d in target .target; do
            if [ -f "$d/release/cqx${{ matrix.suffix }}" ]; then
              cp "$d/release/cqx${{ matrix.suffix }}" "dist/cqx-${{ matrix.platform }}${{ matrix.suffix }}"
              break
            fi
          done
          test -f "dist/cqx-${{ matrix.platform }}${{ matrix.suffix }}" \
            || { echo "::error::no binary was produced"; exit 1; }
          chmod +x "dist/cqx-${{ matrix.platform }}${{ matrix.suffix }}" || true

      # The binary has to run on the machine that built it before anyone is
      # asked to download it. Version, because it is the one answer that
      # proves the whole thing linked and started rather than merely existing.
      - name: It runs, and says who it is
        shell: bash
        run: |
          BIN="dist/cqx-${{ matrix.platform }}${{ matrix.suffix }}"
          SAID=$("./$BIN" --version)
          echo "$SAID"
          [ "$SAID" = "cqx ${{ needs.resolve.outputs.version }}" ] \
            || { echo "::error::binary says '$SAID', expected 'cqx ${{ needs.resolve.outputs.version }}'"; exit 1; }

      - uses: ./.github/actions/sccache-stats
        if: always()

      - uses: actions/upload-artifact@v4
        with:
          name: cqx-${{ matrix.platform }}
          path: dist/*
          retention-days: 1

  # ---------------------------------------------------------------------------
  wasm:
    name: cqx_wasm.wasm
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'release' || 'public-ci' }}
    env:
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: cqx-sccache-linux-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/sccache

      - name: Build
        run: cargo build --locked --release --target wasm32-unknown-unknown -p cqx-wasm

      - name: Collect
        run: |
          mkdir -p dist
          for d in target .target; do
            f="$d/wasm32-unknown-unknown/release/cqx_wasm.wasm"
            [ -f "$f" ] && cp "$f" dist/ && break
          done
          test -f dist/cqx_wasm.wasm || { echo "::error::no wasm was produced"; exit 1; }
          ls -l dist/cqx_wasm.wasm

      - uses: ./.github/actions/sccache-stats
        if: always()

      - uses: actions/upload-artifact@v4
        with:
          name: cqx-wasm
          path: dist/*
          retention-days: 1

  # ---------------------------------------------------------------------------
  npm:
    name: npm packages
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'release' || 'public-ci' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          pattern: cqx-*
          path: incoming
          merge-multiple: true
      - name: Assemble packages from release binaries
        run: node npm/build.mjs '${{ needs.resolve.outputs.version }}' incoming
      - name: Verify the installed command and platform selection
        run: |
          chmod +x incoming/cqx-linux-x64
          node npm/test.mjs "$PWD/incoming/cqx-linux-x64"
      - name: Inspect every tarball
        run: |
          for package in npm/dist/platform/* npm/dist/cli; do
            (cd "$package" && npm pack --dry-run)
          done
      # Ava configures trusted publishing for all five @cqxai packages:
      # cqxai/cqx, release.yml, environment release. No copied npm token.
      - name: Publish platforms before the CLI
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          for package in npm/dist/platform/*; do
            (cd "$package" && npm publish --access public --provenance)
          done
          (cd npm/dist/cli && npm publish --access public --provenance)

  publish:
    name: publish
    needs: [resolve, build, wasm]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: release
    env:
      # Same spelling public-ci uses, deliberately: the environment decides
      # which token a job gets, so a workflow never has to know which one it
      # is holding. This one reaches the release buckets; that one does not.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      # This job downloads artefacts and never checks the source out, so there
      # is no git repository for `gh` to infer the repository from. Saying it
      # outright is cheaper than cloning the tree to answer one question.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Gather
        run: |
          mkdir -p out
          find incoming -type f -exec cp {} out/ \;
          cd out
          # Checksums over everything, in one file, so a download can be
          # verified without trusting the page it came from.
          sha256sum -- * > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" out/* --clobber

      # R2 as well as GitHub: an installer that curls a versioned path wants a
      # CDN and a stable URL, not a redirect chain through a release page.
      - name: Mirror into R2
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::the release environment is missing R2 credentials"
            exit 1
          fi
          command -v aws >/dev/null 2>&1 || pip install --quiet --break-system-packages awscli

          # Binaries and checksums, under the version that produced them.
          aws s3 sync out/ "s3://cqx-releases/${TAG}/" \
            --endpoint-url "$R2_ENDPOINT" --exclude 'cqx_wasm.wasm'

          # The wasm goes to its own bucket, which is the one browsers read.
          aws s3 cp out/cqx_wasm.wasm "s3://cqx-wasm/${TAG}/cqx_wasm.wasm" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/wasm
          aws s3 cp out/SHA256SUMS "s3://cqx-wasm/${TAG}/SHA256SUMS" \
            --endpoint-url "$R2_ENDPOINT"

          # And a pointer that does not move, so something can ask what the
          # current release is without listing a bucket.
          printf '{"tag":"%s","version":"%s"}\n' "$TAG" "$VERSION" > latest.json
          aws s3 cp latest.json "s3://cqx-releases/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json

          echo "published $TAG"

  # ---------------------------------------------------------------------------
  # cqx.bio names the current release and links to it. It reads that when it is
  # built, because the front page is prerendered and has to stay that way — so a
  # new release has to ask it to build again.
  #
  # Guarded on the secret rather than requiring it: a release must not fail
  # because a marketing site is not wired up yet.
  refresh-site:
    name: refresh cqx.bio
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Ask cqx.bio to rebuild
        env:
          HOOK: ${{ secrets.CQX_BIO_DEPLOY_HOOK }}
        run: |
          if [ -z "${HOOK:-}" ]; then
            echo "No CQX_BIO_DEPLOY_HOOK set; the badge will refresh on the site's next deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "cqx.bio rebuild requested."
