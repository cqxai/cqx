name: sccache
description: Install sccache, point it at R2, and make every later cargo step use it.

# SCCACHE IS REQUIRED FOR ALL RUST COMPILATION.
#
# One place rather than one per job, because three jobs repeating five
# environment variables is three chances for them to stop agreeing. The job
# supplies the credentials and the bucket; this installs the binary, proves it
# can reach the bucket, and exports RUSTC_WRAPPER so every cargo step after it
# is cached without having to remember to say so.
#
# It fails loudly when the credentials are missing, with one exception: a pull
# request from a fork, where GitHub withholds secrets by design. Failing there
# would mean an outside contributor cannot get a green check on a public
# repository, which is a worse outcome than an uncached build.

runs:
  using: composite
  steps:
    - uses: mozilla-actions/sccache-action@v0.0.9

    - name: Point sccache at R2
      shell: bash
      run: |
        missing=
        [ -n "$SCCACHE_BUCKET" ] || missing="$missing SCCACHE_BUCKET"
        [ -n "$SCCACHE_ENDPOINT" ] || missing="$missing SCCACHE_ENDPOINT"
        [ -n "$AWS_ACCESS_KEY_ID" ] || missing="$missing AWS_ACCESS_KEY_ID"
        [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing="$missing AWS_SECRET_ACCESS_KEY"

        if [ -n "$missing" ]; then
          # A fork never receives secrets, however the workflow is written.
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::warning::No R2 credentials (fork pull request). Building uncached — this will be slow but correct."
            exit 0
          fi
          echo "::error::R2 sccache credentials are missing:$missing. SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
          exit 1
        fi

        if ! command -v sccache >/dev/null 2>&1; then
          echo "::error::sccache is not on PATH. SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
          exit 1
        fi

        # Proves the credentials reach *this* bucket before a build depends on
        # it. sccache itself fails soft — it would compile everything and write
        # nothing, which looks like a slow build rather than a broken cache.
        command -v aws >/dev/null 2>&1 || pip install --quiet --break-system-packages awscli
        if ! aws s3 ls "s3://${SCCACHE_BUCKET}/" --endpoint-url "$SCCACHE_ENDPOINT" >/dev/null; then
          echo "::error::Cannot reach s3://${SCCACHE_BUCKET}/ with these credentials."
          exit 1
        fi

        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "sccache → ${SCCACHE_BUCKET}"
