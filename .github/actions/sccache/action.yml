name: sccache
description: Install sccache, prove it is pointed at R2, and cache every later cargo step.

# SCCACHE IS REQUIRED FOR ALL RUST COMPILATION.
#
# One place rather than the same five environment variables in every job,
# which is one chance per job for them to stop agreeing. The job supplies the
# credentials and the bucket; this installs the binary, proves the
# configuration took, and exports RUSTC_WRAPPER so every cargo step after it
# is cached without anyone having to remember.
#
# Proving it took matters because sccache fails soft in both directions: a
# missing bucket name silently means "local disk", and unreachable credentials
# silently mean "compile everything, write nothing". Both look like an
# ordinary slow build. So this asks sccache what it thinks its cache is, and
# the companion `sccache-stats` action checks afterwards that writing worked.
#
# Asking sccache rather than the AWS CLI is deliberate: it needs no extra
# tool, so it behaves the same on Linux, macOS and Windows runners, and it
# reports the view that actually governs the build rather than a second
# opinion from a different client.
#
# It fails loudly when credentials are missing, with one exception: a pull
# request from a fork, where GitHub withholds secrets by design. Failing there
# would mean an outside contributor cannot get a green check on a public
# repository, which is worse than an uncached build.

runs:
  using: composite
  steps:
    - uses: mozilla-actions/sccache-action@v0.0.9

    - name: Point sccache at R2
      shell: bash
      run: |
        missing=
        [ -n "$SCCACHE_BUCKET" ] || missing="$missing SCCACHE_BUCKET"
        [ -n "$SCCACHE_ENDPOINT" ] || missing="$missing SCCACHE_ENDPOINT"
        [ -n "$AWS_ACCESS_KEY_ID" ] || missing="$missing AWS_ACCESS_KEY_ID"
        [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing="$missing AWS_SECRET_ACCESS_KEY"

        if [ -n "$missing" ]; then
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::warning::No R2 credentials (fork pull request). Building uncached — slow, but correct."
            exit 0
          fi
          echo "::error::R2 sccache credentials are missing:$missing. SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
          exit 1
        fi

        command -v sccache >/dev/null 2>&1 || {
          echo "::error::sccache is not on PATH. SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
          exit 1
        }

        where=$(sccache --show-stats | grep -i 'Cache location' || true)
        case "$where" in
          *s3*"$SCCACHE_BUCKET"*)
            echo "$where"
            ;;
          *)
            echo "::error::sccache is not using R2. It reports: ${where:-nothing}"
            exit 1
            ;;
        esac

        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
